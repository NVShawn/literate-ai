name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every required check is a sibling in one cancellation scope. Keep the names
  # stable for branch protection, and never allow a failed cell to continue.
  checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: true
      matrix:
        include:
          - task: "skill-evaluation"
            name: "Changed skill admission"
            os: "ubuntu-latest"
            python: "3.13"
            group: 0
          - task: "documentation"
            name: "Documentation / ubuntu-latest"
            os: "ubuntu-latest"
            python: "3.12"
            group: 0
          - task: "documentation"
            name: "Documentation / macos-latest"
            os: "macos-latest"
            python: "3.12"
            group: 0
          - task: "documentation"
            name: "Documentation / windows-latest"
            os: "windows-latest"
            python: "3.12"
            group: 0
          - task: "sample-composition"
            name: "Sample composition / ubuntu-latest"
            os: "ubuntu-latest"
            python: "3.12"
            group: 0
          - task: "sample-composition"
            name: "Sample composition / macos-latest"
            os: "macos-latest"
            python: "3.12"
            group: 0
          - task: "sample-composition"
            name: "Sample composition / windows-latest"
            os: "windows-latest"
            python: "3.12"
            group: 0
          - task: "conformance"
            name: "ubuntu-latest / Python 3.11"
            os: "ubuntu-latest"
            python: "3.11"
            group: 0
          - task: "conformance"
            name: "ubuntu-latest / Python 3.14"
            os: "ubuntu-latest"
            python: "3.14"
            group: 0
          - task: "conformance"
            name: "macos-latest / Python 3.11"
            os: "macos-latest"
            python: "3.11"
            group: 0
            test_pattern: "test_[a-p]*.py"
          - task: "conformance"
            name: "macos-latest / Python 3.11 (2 of 3)"
            os: "macos-latest"
            python: "3.11"
            group: 0
            test_pattern: "test_[q-s]*.py"
          - task: "conformance"
            name: "macos-latest / Python 3.11 (3 of 3)"
            os: "macos-latest"
            python: "3.11"
            group: 0
            test_pattern: "test_[t-z]*.py"
          - task: "conformance"
            name: "macos-latest / Python 3.14"
            os: "macos-latest"
            python: "3.14"
            group: 0
          - task: "windows-gates"
            name: "Windows / Python 3.12 / lint, OpenSpec, wheel"
            os: "windows-latest"
            python: "3.12"
            group: 0
          - task: "windows-tests"
            name: "Windows / Python 3.12 / tests (1 of 3)"
            os: "windows-latest"
            python: "3.12"
            group: 1
          - task: "windows-tests"
            name: "Windows / Python 3.12 / tests (2 of 3)"
            os: "windows-latest"
            python: "3.12"
            group: 2
          - task: "windows-tests"
            name: "Windows / Python 3.12 / tests (3 of 3)"
            os: "windows-latest"
            python: "3.12"
            group: 3
          - task: "cpp-native"
            name: "Native C++ library / ubuntu-latest"
            os: "ubuntu-latest"
            python: "3.12"
            group: 0
          - task: "cpp-native"
            name: "Native C++ library / windows-latest"
            os: "windows-latest"
            python: "3.12"
            group: 0
    steps:
      # skill-evaluation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.task == 'skill-evaluation'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.task == 'skill-evaluation'
        with:
          python-version: "3.13"
      - name: Install framework for skill detection
        if: matrix.task == 'skill-evaluation'
        run: python -m pip install -e .
      - name: Detect new or modified skills
        if: matrix.task == 'skill-evaluation'
        id: changed-skills
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" ]]; then
              # workflow_dispatch has no push 'before'; compare with the first parent.
              base="$(git rev-parse --verify 'HEAD^' 2>/dev/null || git rev-parse HEAD)"
            elif [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-parse --verify "refs/remotes/origin/${{ github.event.repository.default_branch }}^{commit}")"
            fi
          fi
          changed_skills="$(python scripts/evaluate_changed_skills.py --base "$base" --list)" || exit "$?"
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          if [[ -n "$changed_skills" ]]; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: matrix.task == 'skill-evaluation'
        with:
          version: "0.12.4"
          enable-cache: false
      - name: Verify pinned uv bootstrap
        if: matrix.task == 'skill-evaluation'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          version = subprocess.check_output(["uv", "--version"], text=True).strip()
          print(version)
          if version.split()[:2] != ["uv", "0.12.4"]:
              raise SystemExit("Unexpected uv version")
          PY
      - name: Install pinned NVIDIA SkillEvaluator
        if: matrix.task == 'skill-evaluation' && (steps.changed-skills.outputs.changed == 'true')
        run: make skill-evaluator-install
      - name: Admit changed skills
        if: matrix.task == 'skill-evaluation' && (steps.changed-skills.outputs.changed == 'true')
        env:
          LITAI_SKILL_EVALUATION_BASE: ${{ steps.changed-skills.outputs.base }}
        run: make skills-check PYTHON=python

      # documentation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.task == 'documentation'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.task == 'documentation'
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install isolated documentation tooling
        if: matrix.task == 'documentation'
        run: npm --prefix tools/openspec ci
      - name: Extract and render every Mermaid diagram
        if: matrix.task == 'documentation'
        run: npm --prefix tools/openspec run documentation:check

      # sample-composition
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.task == 'sample-composition'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.task == 'sample-composition'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.task == 'sample-composition'
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify native SBOM prerequisites and install, uninstall, and reinstall the CLI
        if: matrix.task == 'sample-composition'
        env:
          LITAI_INSTALL_DEPENDENCIES: "yes"
        run: |
          make install PYTHON=python PREFIX=_build/ci-install
          make uninstall PYTHON=python PREFIX=_build/ci-install
          make install PYTHON=python PREFIX=_build/ci-install
      - name: Install the framework
        if: matrix.task == 'sample-composition'
        run: python -m pip install -e .
      - name: Validate the canonical project
        if: matrix.task == 'sample-composition'
        run: python -m literate_ai.cli project validate .
      - name: Verify recipe composition and the guarded C++ adapter
        if: matrix.task == 'sample-composition'
        run: >-
          python -m unittest
          tests.conformance.test_sample_ladder.NeutralSampleLadderTests.test_all_host_recipes_compose_from_specs_and_real_flavors
          tests.unit.test_guarded_builder.GuardedCppBuilderTests
          tests.unit.test_project_test_receipt
          tests.unit.test_rebuild_source_cache_protocol

      # conformance
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.task == 'conformance'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.task == 'conformance'
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.task == 'conformance'
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Python contributor tools
        if: matrix.task == 'conformance'
        run: python -m pip install -e ".[dev]"
      - name: Install isolated OpenSpec tooling
        if: matrix.task == 'conformance'
        run: make tools-install
      - name: Run conformance gates
        if: matrix.task == 'conformance'
        run: >-
          make validate PYTHON=python RUFF=ruff
          PYTHON_TEST_PATTERN="${{ matrix.test_pattern || 'test*.py' }}"
      - name: Verify the installed wheel outside the checkout
        if: matrix.task == 'conformance'
        run: make wheel-check PYTHON=python
      - name: Upload the smoke-tested wheel and exact manifest
        if: matrix.task == 'conformance'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualified-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: _build/ci-wheels
          if-no-files-found: error
      - name: Upload release evidence
        if: matrix.task == 'conformance' && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: _build/evidence
          if-no-files-found: warn
      - name: Explain release evidence
        if: matrix.task == 'conformance' && (failure())
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m literate_ai.cli release evidence explain --project .

      # windows-gates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.task == 'windows-gates'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.task == 'windows-gates'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.task == 'windows-gates'
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Python contributor tools
        if: matrix.task == 'windows-gates'
        run: python -m pip install -e ".[dev]"
      - name: Install isolated contributor tools
        if: matrix.task == 'windows-gates'
        run: npm --prefix tools/openspec ci
      - name: Detect, install, and expose required native toolchains
        if: matrix.task == 'windows-gates'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Add-WorkflowPath {
            param([string]$Path)
            if (-not $Path -or -not (Test-Path -LiteralPath $Path -PathType Container)) {
              return
            }
            $resolved = (Resolve-Path -LiteralPath $Path).Path
            $entries = $env:PATH -split [IO.Path]::PathSeparator
            if ($entries -notcontains $resolved) {
              $env:PATH = "$resolved$([IO.Path]::PathSeparator)$env:PATH"
            }
            $resolved | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          function Install-WhenMissing {
            param(
              [string]$Command,
              [string]$Package,
              [string[]]$CandidatePaths = @()
            )
            if (Get-Command $Command -CommandType Application -ErrorAction SilentlyContinue) {
              Write-Host "Reusing $Command from PATH"
              return
            }
            Write-Host "$Command is absent; installing Chocolatey package $Package"
            choco install $Package -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey could not install $Package for missing command $Command"
            }
            foreach ($candidate in $CandidatePaths) {
              Add-WorkflowPath $candidate
            }
            if (-not (Get-Command $Command -CommandType Application -ErrorAction SilentlyContinue)) {
              throw "Chocolatey installed $Package but $Command is still unavailable on PATH"
            }
          }

          @(
            (Resolve-Path "tools/openspec/node_modules/.bin").Path,
            "C:\Program Files\LLVM\bin",
            "C:\ProgramData\chocolatey\bin"
          ) | ForEach-Object { Add-WorkflowPath $_ }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "Visual Studio locator is unavailable on the Windows runner"
          }
          $cl = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "VC\Tools\MSVC\**\bin\Hostx64\x64\cl.exe" |
            Select-Object -First 1
          if (-not $cl -or -not (Test-Path -LiteralPath $cl -PathType Leaf)) {
            throw "Visual Studio x64 C++ compiler is unavailable on the Windows runner"
          }
          Add-WorkflowPath (Split-Path -Parent $cl)

          Install-WhenMissing "llvm-readobj.exe" "llvm" @(
            "C:\Program Files\LLVM\bin"
          )
          Install-WhenMissing "rustc.exe" "rust" @("C:\ProgramData\chocolatey\bin")
      - name: Preflight every required Windows tool
        if: matrix.task == 'windows-gates'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            @{ Command = "python.exe"; Arguments = @("--version") },
            @{ Command = "node.exe"; Arguments = @("--version") },
            @{ Command = "npm.cmd"; Arguments = @("--version") },
            @{ Command = "cl.exe"; Arguments = @("/?") },
            @{ Command = "rustc.exe"; Arguments = @("--version") },
            @{ Command = "llvm-readobj.exe"; Arguments = @("--version") }
          )
          $missing = @()
          foreach ($requirement in $required) {
            $tool = Get-Command $requirement.Command -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $tool) {
              $missing += $requirement.Command
              continue
            }
            Write-Host "Using $($requirement.Command) from $($tool.Source)"
            & $tool.Source @($requirement.Arguments)
            if ($LASTEXITCODE -ne 0) {
              throw "$($requirement.Command) preflight failed with exit code $LASTEXITCODE"
            }
          }
          if ($missing.Count -gt 0) {
            throw "Required Windows tools are unavailable on PATH: $($missing -join ', ')"
          }
      - name: Compile-check the Python framework
        if: matrix.task == 'windows-gates'
        shell: pwsh
        run: |
          python -m compileall -q src tests
          python -m py_compile tests/conformance/support/sample_runner.py scripts/run_samples.py tests/conformance/support/self_hosting_proof.py scripts/run_source_to_specification_fixtures.py
      - name: Run strict lint and format checks
        if: matrix.task == 'windows-gates'
        shell: pwsh
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Validate OpenSpec and documentation
        if: matrix.task == 'windows-gates'
        shell: pwsh
        run: |
          npm --prefix tools/openspec run openspec:check
          npm --prefix tools/openspec run documentation:check
      - name: Verify the installed wheel outside the checkout
        if: matrix.task == 'windows-gates'
        run: python scripts/wheel_smoke.py
      - name: Upload the smoke-tested wheel and exact manifest
        if: matrix.task == 'windows-gates'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualified-wheel-windows-3.12
          path: _build/ci-wheels
          if-no-files-found: error
      - name: Upload release evidence
        if: matrix.task == 'windows-gates' && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-evidence
          path: _build/evidence
          if-no-files-found: warn
      - name: Explain release evidence
        if: matrix.task == 'windows-gates' && (failure())
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m literate_ai.cli release evidence explain --project .

      # windows-tests
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.task == 'windows-tests'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.task == 'windows-tests'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.task == 'windows-tests'
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Python contributor tools
        if: matrix.task == 'windows-tests'
        run: python -m pip install -e ".[dev]"
      - name: Install isolated contributor tools
        if: matrix.task == 'windows-tests'
        run: npm --prefix tools/openspec ci
      - name: Detect, install, and expose required native toolchains
        if: matrix.task == 'windows-tests'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Add-WorkflowPath {
            param([string]$Path)
            if (-not $Path -or -not (Test-Path -LiteralPath $Path -PathType Container)) {
              return
            }
            $resolved = (Resolve-Path -LiteralPath $Path).Path
            $entries = $env:PATH -split [IO.Path]::PathSeparator
            if ($entries -notcontains $resolved) {
              $env:PATH = "$resolved$([IO.Path]::PathSeparator)$env:PATH"
            }
            $resolved | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          function Install-WhenMissing {
            param(
              [string]$Command,
              [string]$Package,
              [string[]]$CandidatePaths = @()
            )
            if (Get-Command $Command -CommandType Application -ErrorAction SilentlyContinue) {
              Write-Host "Reusing $Command from PATH"
              return
            }
            Write-Host "$Command is absent; installing Chocolatey package $Package"
            choco install $Package -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey could not install $Package for missing command $Command"
            }
            foreach ($candidate in $CandidatePaths) {
              Add-WorkflowPath $candidate
            }
            if (-not (Get-Command $Command -CommandType Application -ErrorAction SilentlyContinue)) {
              throw "Chocolatey installed $Package but $Command is still unavailable on PATH"
            }
          }

          @(
            (Resolve-Path "tools/openspec/node_modules/.bin").Path,
            "C:\Program Files\LLVM\bin",
            "C:\ProgramData\chocolatey\bin"
          ) | ForEach-Object { Add-WorkflowPath $_ }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "Visual Studio locator is unavailable on the Windows runner"
          }
          $cl = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "VC\Tools\MSVC\**\bin\Hostx64\x64\cl.exe" |
            Select-Object -First 1
          if (-not $cl -or -not (Test-Path -LiteralPath $cl -PathType Leaf)) {
            throw "Visual Studio x64 C++ compiler is unavailable on the Windows runner"
          }
          Add-WorkflowPath (Split-Path -Parent $cl)

          Install-WhenMissing "llvm-readobj.exe" "llvm" @(
            "C:\Program Files\LLVM\bin"
          )
          Install-WhenMissing "rustc.exe" "rust" @("C:\ProgramData\chocolatey\bin")
      - name: Preflight every required Windows tool
        if: matrix.task == 'windows-tests'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            @{ Command = "python.exe"; Arguments = @("--version") },
            @{ Command = "node.exe"; Arguments = @("--version") },
            @{ Command = "npm.cmd"; Arguments = @("--version") },
            @{ Command = "cl.exe"; Arguments = @("/?") },
            @{ Command = "rustc.exe"; Arguments = @("--version") },
            @{ Command = "llvm-readobj.exe"; Arguments = @("--version") }
          )
          $missing = @()
          foreach ($requirement in $required) {
            $tool = Get-Command $requirement.Command -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $tool) {
              $missing += $requirement.Command
              continue
            }
            Write-Host "Using $($requirement.Command) from $($tool.Source)"
            & $tool.Source @($requirement.Arguments)
            if ($LASTEXITCODE -ne 0) {
              throw "$($requirement.Command) preflight failed with exit code $LASTEXITCODE"
            }
          }
          if ($missing.Count -gt 0) {
            throw "Required Windows tools are unavailable on PATH: $($missing -join ', ')"
          }
      - name: Run this shard's tests
        if: matrix.task == 'windows-tests'
        shell: pwsh
        run: |
          python scripts/profile_pytest.py logs/profile-${{ matrix.group }}.ndjson logs/profile-report-${{ matrix.group }}.json -- --splits 3 --group ${{ matrix.group }} --durations-path=.test_durations tests/unit tests/conformance tests/test_package.py
      - name: Upload the profiling trace and hotspot report
        if: matrix.task == 'windows-tests' && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-conformance-profile-${{ matrix.group }}
          path: |
            logs/profile-${{ matrix.group }}.ndjson
            logs/profile-report-${{ matrix.group }}.json
          if-no-files-found: warn

      # cpp-native
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.task == 'cpp-native'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.task == 'cpp-native'
        with:
          python-version: "3.12"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        if: matrix.task == 'cpp-native'
        with:
          bazelisk-cache: true
          cache-save: false
          repository-cache: true
      - name: Create an isolated native qualification environment
        if: matrix.task == 'cpp-native'
        run: python -m venv .native-venv
      - name: Expose the isolated Windows environment
        if: matrix.task == 'cpp-native' && (runner.os == 'Windows')
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\.native-venv\Scripts"
      - name: Expose the isolated Linux environment
        if: matrix.task == 'cpp-native' && (runner.os != 'Windows')
        shell: bash
        run: echo "${{ github.workspace }}/.native-venv/bin" >> "$GITHUB_PATH"
      - name: Configure the MSVC developer environment
        if: matrix.task == 'cpp-native' && (runner.os == 'Windows')
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64
      - name: Install exact native qualification tools
        if: matrix.task == 'cpp-native'
        run: python -m pip install -e ".[dev]" conan==2.32.0
      - name: Preflight exact Bazel and Conan versions
        if: matrix.task == 'cpp-native'
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          executables = {
              "bazel": (shutil.which("bazel"), "bazel 9.2.0"),
              "conan": (
                  Path(sys.executable).with_name(
                      "conan.exe" if sys.platform == "win32" else "conan"
                  ),
                  "Conan version 2.32.0",
              ),
          }
          for command, (executable, version) in executables.items():
              if executable is None or not Path(executable).is_file():
                  raise SystemExit(f"{command} is unavailable")
              actual = subprocess.check_output(
                  [str(executable), "--version"], text=True
              ).strip()
              print(actual)
              if actual != version:
                  raise SystemExit(
                      f"expected {version!r} from {command}, received {actual!r}"
                  )
          compiler = "cl" if sys.platform == "win32" else "c++"
          if shutil.which(compiler) is None:
              raise SystemExit(f"{compiler} is unavailable")
      - name: Qualify static and shared Bazel/Conan consumers
        if: matrix.task == 'cpp-native'
        run: >-
          python -m pytest -q -rA -o junit_logging=all
          --junitxml=cpp-native-qualification.xml
          tests/unit/test_cpp_bazel_outputs.py::CppBazelOutputTests::test_locked_cpp_library_runs_through_complete_filesystem_runtime
      - name: Reject skipped or incomplete native qualification
        if: matrix.task == 'cpp-native'
        shell: python
        run: |
          import xml.etree.ElementTree as ET

          root = ET.parse("cpp-native-qualification.xml").getroot()
          counts = {
              name: sum(int(suite.attrib.get(name, "0")) for suite in root)
              for name in ("tests", "failures", "errors", "skipped")
          }
          print(counts)
          expected = {"tests": 11, "failures": 0, "errors": 0, "skipped": 0}
          if counts != expected:
              raise SystemExit(
                  "native qualification did not pass its parent test and all ten "
                  "static/shared product subtests"
              )
      - name: Upload native qualification evidence
        if: matrix.task == 'cpp-native' && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-cpp-qualification-${{ matrix.os }}
          path: cpp-native-qualification.xml
          if-no-files-found: error
