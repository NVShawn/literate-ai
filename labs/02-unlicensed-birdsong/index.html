<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bureau of Unlicensed Birdsong</title><style>:root{color-scheme:dark;--ink:#f7f0df;--night:#07111f;--panel:#0d2034;--orange:#ff8a3d;--teal:#38d6c2;--blue:#73a7ff;--muted:#9db0c4}*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;background:radial-gradient(circle at 70% 20%,#173552 0,var(--night) 48%,#03070d 100%);color:var(--ink);font:16px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.shell{display:grid;grid-template-columns:minmax(280px,360px) 1fr;min-height:100vh}.lesson{min-width:0;padding:28px;border-right:1px solid #ffffff1f;background:#06101bd9;overflow:auto}.eyebrow{color:var(--orange);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.lesson h1{font-size:clamp(28px,4vw,46px);line-height:1;margin:.2em 0}.lesson h1,.lesson p,.learning,.authority,.footer{overflow-wrap:anywhere}.lesson p{color:#d1dce7}.learning{border-left:4px solid var(--teal);padding:10px 14px;background:#16314780}.graph{width:100%;height:260px;margin:20px 0;border:1px solid #ffffff24;border-radius:18px;background:#071523}.node{cursor:pointer}.node rect{fill:#142c44;stroke:#73a7ff;stroke-width:2}.node text{fill:#f7f0df;font-size:12px;font-weight:700}.node.dense text{font-size:10px}.node.active rect{fill:#5c2e1f;stroke:#ff8a3d}.edge{stroke:#637b91;stroke-width:2;marker-end:url(#arrow)}.authority{min-height:76px;color:#dbe7f2}.stage{position:relative;min-width:0;display:flex;flex-direction:column;padding:24px}.stage-head{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}.stage-head h2{margin:0;font-size:clamp(22px,3vw,36px)}.badge{border:1px solid #ffffff42;border-radius:999px;padding:7px 12px;color:var(--teal);font-size:13px}.viewport{position:relative;flex:1;min-height:480px;border-radius:28px;overflow:hidden;background:#050a10;box-shadow:0 25px 80px #0008,inset 0 0 0 1px #ffffff1f}.viewport canvas{display:block;width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.controls button,.controls input{accent-color:var(--orange)}button{background:var(--orange);color:#1b0b02;border:0;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer}button.secondary{background:#17324d;color:var(--ink);border:1px solid #ffffff2c}.readout{margin-left:auto;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.spec{max-width:100%;white-space:pre-wrap;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#b9c9d8;max-height:180px;overflow:auto;background:#02070c;padding:12px;border-radius:12px}.footer{color:#7f94a8;font-size:12px;margin-top:14px}.flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 5px var(--orange);opacity:0;transition:opacity .2s}.flash.on{opacity:1}@media(max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}.lesson{border-right:0;border-bottom:1px solid #ffffff1f}.stage{padding:18px}.stage-head{align-items:flex-start;flex-wrap:wrap}.graph{height:220px}.viewport{min-height:420px}.readout{width:100%;margin:0}}

</style></head><body><div class="shell"><aside class="lesson"><div class="eyebrow" data-level></div><h1 data-title></h1><p data-subtitle></p><p class="learning" data-learning></p><div data-graph></div><div class="authority" data-authority>Select a graph node to inspect its authority.</div><details><summary>Readable specification</summary><pre class="spec" data-spec></pre></details><p class="footer">One file. No network. Generated from shared lab support plus this lab's Component.</p></aside><main class="stage"><header class="stage-head"><h2>Permit queue for fictional birds</h2><span class="badge">offline artifact</span></header><section class="viewport"><canvas aria-label="Lab visual output"></canvas><div class="flash"></div></section><div class="controls" data-controls></div><div class="readout" data-readout>ready</div></main></div><script>(()=>{const q=(s,r=document)=>r.querySelector(s);function graph(nodes,edges){const w=320,h=250,positions=new Map(),dense=nodes.length>6,rx=dense?116:105,ry=dense?96:88,bw=dense?94:108;nodes.forEach((n,i)=>{const a=(Math.PI*2*i/nodes.length)-Math.PI/2;positions.set(n.id,{x:160+Math.cos(a)*rx,y:125+Math.sin(a)*ry})});return `<svg class="graph" viewBox="0 0 ${w} ${h}" role="img" aria-label="Component authority graph"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#637b91"/></marker></defs>${edges.map(e=>{const a=positions.get(e[0]),b=positions.get(e[1]);return `<line class="edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`}).join('')}${nodes.map(n=>{const p=positions.get(n.id);return `<g class="node${dense?' dense':''}" data-node="${n.id}" transform="translate(${p.x-bw/2} ${p.y-20})"><rect width="${bw}" height="40" rx="12"/><text x="${bw/2}" y="24" text-anchor="middle">${n.label}</text></g>`}).join('')}</svg>`}function canvas(){const c=q('canvas'),ctx=c.getContext('2d');function size(){const d=devicePixelRatio||1,r=c.getBoundingClientRect(),w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h}ctx.setTransform(d,0,0,d,0,0);return r}return{canvas:c,ctx,size}}function mount(config,start){q('[data-title]').textContent=config.title;q('[data-subtitle]').textContent=config.subtitle;q('[data-learning]').textContent=config.learning;q('[data-level]').textContent=`Lab ${config.level}`;q('[data-spec]').textContent=config.spec;q('[data-graph]').innerHTML=graph(config.nodes,config.edges);const authority=q('[data-authority]');q('[data-graph]').addEventListener('click',e=>{const node=e.target.closest('.node');if(!node)return;document.querySelectorAll('.node').forEach(n=>n.classList.toggle('active',n===node));const found=config.nodes.find(n=>n.id===node.dataset.node);authority.textContent=found.detail;q('.flash').classList.add('on');setTimeout(()=>q('.flash').classList.remove('on'),180)});const api={...canvas(),controls:q('[data-controls]'),readout:q('[data-readout]'),log:v=>q('[data-readout]').textContent=v,button:(label,fn,secondary=false)=>{const b=document.createElement('button');b.textContent=label;b.className=secondary?'secondary':'';b.onclick=fn;api.controls.appendChild(b);return b},slider:(min,max,value,fn)=>{const i=document.createElement('input');i.type='range';i.min=min;i.max=max;i.value=value;i.oninput=()=>fn(+i.value);api.controls.appendChild(i);return i},audio:()=>new (window.AudioContext||window.webkitAudioContext)()};start(api)}window.LitLab={mount}})();

</script><script>window.startLab=api=>{let ac,timer,step=0,feathers=[];const notes=[261.6,293.7,329.6,392,440];function tick(sound=true){const n=notes[(step*3+Math.floor(step/4))%notes.length];feathers.push({x:(step*47)%700,y:80+(step*83)%280,f:n,life:1});if(sound&&ac){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=n;o.type='sine';g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.28);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.3)}step++}api.button('Start the paperwork',()=>{if(timer)return;ac=ac||api.audio();ac.resume();timer=setInterval(()=>tick(true),240)});api.button('Stop issuing permits',()=>{clearInterval(timer);timer=null},true);setInterval(()=>{if(!timer)tick(false)},700);function draw(){const r=api.size(),c=api.ctx;c.fillStyle='#07111f';c.fillRect(0,0,r.width,r.height);feathers=feathers.filter(f=>f.life>.02);feathers.forEach(f=>{f.life*=.985;c.save();c.translate((f.x%r.width),f.y%r.height);c.rotate(f.f/500);c.strokeStyle=`rgba(56,214,194,${f.life})`;c.lineWidth=3;c.beginPath();c.moveTo(-24,0);c.quadraticCurveTo(0,-18,24,0);c.quadraticCurveTo(0,18,-24,0);c.stroke();c.restore()});api.log(`${timer?'audio licensed':'visual permits only'} · docket ${step}`);requestAnimationFrame(draw)}draw()};

</script><script>LitLab.mount({"level":"02","title":"Bureau of Unlicensed Birdsong","subtitle":"A pentatonic permitting office staffed entirely by oscillators.","learning":"Capabilities can be optional and consent-bound: the visual Component runs before the audio realization starts.","stage":"Permit queue for fictional birds","media":["html","math","audio","music"],"nodes":[{"id":"spec","label":"Component","detail":"The Component requires bounded notes, visible feathers and explicit audio consent."},{"id":"score","label":"Score","detail":"A deterministic pentatonic rule owns note selection."},{"id":"audio","label":"Audio Flavor","detail":"Web Audio realizes sound only after a user gesture."},{"id":"view","label":"Feather view","detail":"Canvas realizes the same note events visually."},{"id":"accept","label":"Acceptance","detail":"Single-loop start/stop and pre-consent visuals remain observable."}],"edges":[["spec","score"],["score","audio"],["score","view"],["audio","accept"],["view","accept"]],"spec":"# Bureau of unlicensed birdsong\n\n## Behavior\n\nGenerate a bounded pentatonic sequence. Each note produces sound and a visible feather.\nAudio requires explicit user consent and stops on request.\n\n## Acceptance\n\nThe visualizer works before audio consent. Start and stop never create overlapping loops.\n\n"},window.startLab);</script></body></html>
